server {
    listen 1515;
    server_name _;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/game;

    # PHP fastcgi(绝对路径,避免 nginx prefix 解析歧义)
    include /www/server/nginx/conf/enable-php-56.conf;

    # 禁止访问敏感文件
    location ~* (\.user\.ini|\.htaccess|\.env|.*\.sql|\.bak|\.git|composer\.json)$ {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        access_log off;
    }
    location ~ .*\.(js|css)?$ {
        expires 12h;
        access_log off;
    }

    access_log  /www/server/nginx/logs/game_access.log;
    error_log   /www/server/nginx/logs/game_error.log;
}
